# ══════════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline — GitHub Actions Workflow
# ══════════════════════════════════════════════════════════════════════════════
#
# JOBS:
#   1. test          → Runs on every push & pull_request (all branches)
#   2. build-push    → Runs on push to `main` only, after `test` passes
#   3. deploy        → Runs after `build-push` succeeds (prints deploy command)
#
# REQUIRED GITHUB SECRETS (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  → Your Docker Hub username
#   DOCKERHUB_TOKEN     → Docker Hub access token (not your password)
#                         Create at: https://hub.docker.com/settings/security
# ══════════════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: ["**"]          # Trigger tests on any branch push
  pull_request:
    branches: [main]          # Trigger tests on PRs targeting main

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Run Automated Tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"          # Cache pip packages to speed up future runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker Image & Push to Docker Hub
  # Runs only on pushes to `main` AND only if tests pass
  # ────────────────────────────────────────────────────────────────────────────
  build-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                        # Wait for `test` job to succeed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app
          tags: |
            # Tag with the short git SHA (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-
            # Tag as `latest` on every push to main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy
  # Runs only after build-push succeeds
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy — pull latest image and restart
        # ──────────────────────────────────────────────────────────────────────
        # OPTION A (current): Simulate deploy by printing the deploy command.
        # This lets the pipeline run end-to-end without a server.
        #
        # OPTION B (with a real server): Replace the `run` block below with:
        #
        #   uses: appleboy/ssh-action@v1.0.3
        #   with:
        #     host:     ${{ secrets.DEPLOY_HOST }}
        #     username: ${{ secrets.DEPLOY_USER }}
        #     key:      ${{ secrets.DEPLOY_SSH_KEY }}
        #     script: |
        #       docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:latest
        #       docker compose -f /opt/devops-app/docker-compose.yml up -d
        #
        # Add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY to GitHub Secrets.
        # ──────────────────────────────────────────────────────────────────────
        run: |
          echo "✅ Build & push succeeded!"
          echo ""
          echo "To deploy on any machine that has Docker:"
          echo ""
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:latest"
          echo "  docker compose up -d"
          echo ""
          echo "Image tags pushed:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:latest"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:sha-${{ github.sha }}"
